# 100-case harness corpus for the MCP evaluation run.
#
# Schema (all fields optional except id/category/message):
#   ui_lang: ru (default) | en
#   history: [{role: customer|manager, text: ...}]   — for language-inheritance cases
#   deal:    {contact, company, channel, plan, seats_used, seat_limit,
#             addons_owned, stage}                    — defaults when omitted
#   expect:
#     lang / lang_source / grounded / intent          — request metadata
#     ids: [..]          — any expected id in top-3 (hit@3); hit@1 tracked too
#     contains: [..]     — casefold substring of customer_reply
#     contains_any: [[..], [..]]  — each group needs ≥1 substring
#     contains_numbers: [..]      — normalized numeric tokens that must appear
#     forbid_numbers: [..]        — numeric traps: must NOT appear
#     upsell / cross_sell: [..]   — EXACT set of internal hint ids
#     fallback: bool     — validation.fallback_used
#     notes_contains: .. — internal notes substring (template path)
#
# Deterministic expectations (lang, grounded, ids, intent, upsell, cross_sell)
# were verified offline against the same backend code (precheck) before the run.

